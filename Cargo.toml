[package]
name = "edge-cut"
version = "0.0.2"
edition = "2024"
authors = ["y_hirata"]

[dependencies]
arboard = "3"
eframe  = { version = "0.34.1", features = ["persistence"] }
image   = "0.25"
rayon   = "1"
rfd     = "0.17.2"
serde   = { version = "1", features = ["derive"] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "EdgeCut"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
incremental = false
codegen-units = 1
