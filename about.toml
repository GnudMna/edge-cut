# cargo-about 設定 (THIRD_PARTY_NOTICES 生成)
#
# 生成: scripts/common/generate-third-party-notices.*
# deny.toml の許可ライセンス・ターゲットに合わせる
#
# 配布スクリプトは --target でプラットフォーム別に生成する。
# 手動生成時は下記 targets (全配布ターゲット) を使用する。

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # egui 同梱フォント (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
