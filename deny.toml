# EdgeCut 依存関係のサプライチェーン監査 (cargo-deny)
#
# 実行: cargo deny check
# 品質チェック: scripts/*/check.* からも呼び出す
#
# ライセンス方針: 独自製品への組み込みが可能なパーミッシブライセンスのみ許可する
# (コピーレフト GPL / LGPL / MPL 等は deny 対象。許可リストに含めない)

[graph]
all-features = true
# 配布対象 OS の依存グラフを検査
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # wayland-scanner / zbus_xml が quick-xml ^0.39 を要求し 0.41 未満に固定されるため (上流更新待ち)
    { id = "RUSTSEC-2026-0194", reason = "wayland-scanner / zbus_xml 経由の quick-xml は上流が ^0.39 のため 0.41 未満に固定される" },
    { id = "RUSTSEC-2026-0195", reason = "wayland-scanner / zbus_xml 経由の quick-xml は上流が ^0.39 のため 0.41 未満に固定される" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # egui 同梱フォント (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
