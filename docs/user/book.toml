# 利用者向けドキュメントの mdBook 設定
# 配布物同梱用の HTML は scripts/common/build-user-docs.ps1 で生成する

[book]
title = "EdgeCut ドキュメント"
language = "ja"
src = "."

[build]
build-dir = "../../target/user-docs"
create-missing = false

[output.html]
no-section-label = true
additional-css = ["custom.css"]

# elasticlunr は空白で語を区切るため日本語ではほぼ機能しない
[output.html.search]
enable = false

[output.html.playground]
runnable = false
