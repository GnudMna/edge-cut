# cargo-about 設定 (THIRD_PARTY_NOTICES 生成)
#
# 生成: scripts/common/generate-third-party-notices.*
# deny.toml の許可ライセンス・ターゲットに合わせる
#
# 対象は Windows (x86_64-pc-windows-msvc) のみ。

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots (ureq / rustls 経由) の CA バンドル用データライセンス
    "CDLA-Permissive-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
]

# 本体 (publish = false) は第三者ソフトウェアではないため対象外にする
# 本体の利用条件は LICENSE を参照する旨をテンプレートに記載している
private = { ignore = true }

ignore-build-dependencies = true
ignore-dev-dependencies = true
