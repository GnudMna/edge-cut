[package]
name = "edge-cut"
version = "1.4.0"
edition = "2024"
rust-version = "1.96"
authors = ["Yuto Hirata"]
description = "画像の背景余白を自動検出・トリミングする GUI ツール"
license-file = "LICENSE"
publish = false
readme = "README.md"
build = "build.rs"

[package.metadata.wix]
upgrade-guid = "72F3B69C-49F4-41F8-BB3B-C69033838D51"
path-guid = "35AA52E3-6EAB-4607-B897-96752961A613"
binary-guid = "E029C37A-4937-4194-B3AD-D24DC55E554F"
shortcut-guid = "64B9A30D-3D20-4CD6-B7E1-CC24A8FDB9BB"
product-icon = "assets/icons/icon.ico"
culture = "ja-JP"
# perUser 専用のため ICE91 (ALLUSERS 非対応ディレクトリ) を抑制
linker-args = ["-sice:ICE91"]

[dependencies]
arboard = "3.7.0"
clipboard-win = "5.4.3"
eframe = { version = "0.37.0", features = ["persistence"] }
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
moxcms = "0.9.2"
tiff = { version = "0.11.3", default-features = false }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
known-folders = "1.4.2"
minisign-verify = "0.3.0"
raw-window-handle = "0.6.2"
semver = "1.0.28"
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
minisign = "0.10.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

[lib]
name = "edge_cut"
path = "src/lib.rs"

[[bin]]
name = "EdgeCut"
path = "src/main.rs"

[lints.rust]
# タイトルバー色の設定 (src/app/title_bar.rs) だけが Win32 API 呼び出しのため許可する
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unsafe ブロックには `// SAFETY:` コメントを必須とする
undocumented_unsafe_blocks = "warn"
# 警告の抑制は理由付きの #[expect] に限る (不要になった抑制は警告で検出する)
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev.package."*"]
# 依存クレート (画像デコード・エンコード等) だけ最適化し、デバッグ実行とテストを速くする。
# 自作コードは最適化しないため、増分ビルドの速さとデバッグのしやすさは変わらない
opt-level = 2

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
incremental = false
codegen-units = 1
